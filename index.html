<!doctype html>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Chopdrop</title>
<!-- inline, so the browser does not go asking for a /favicon.ico there is none of -->
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8863a'/%3E%3C/svg%3E"
/>
<style>
  :root {
    color-scheme: dark;
    --ink: #f1eee6;
    --dim: #a39f94;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0b0a10;
    overflow: hidden;
  }
  body {
    font:
      14px/1.5 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    color: var(--ink);
  }
  #stage {
    position: fixed;
    inset: 0;
    /* fingers on the stage fly the helicopter, and do not scroll, zoom or swipe the page */
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .panel {
    position: fixed;
    padding: 10px 14px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #stats {
    top: 16px;
    right: 16px;
    text-align: right;
    color: var(--dim);
    font-size: 12px;
  }
  #help {
    bottom: 16px;
    left: 16px;
    color: var(--dim);
    font-size: 13px;
  }
  #help span {
    color: var(--ink);
    background: rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    padding: 0 6px;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #0b0a10;
    transition: opacity 0.4s;
  }
  #boot.gone {
    opacity: 0;
    pointer-events: none;
  }
  #boot p {
    color: var(--dim);
  }
  /* the words while a level is flown: what is wanted and where, the ring while loading, and the card at the end */
  #hud .top {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100vw - 28px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  #hud.ended .top {
    display: none;
  }
  #hud .bar,
  #hud .ring {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    color: var(--ink);
    font-weight: 600;
  }
  #hud .bar {
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.25;
  }
  #hud .arrow {
    width: 26px;
    height: 26px;
    flex: none;
    fill: #ffc23a;
    stroke: #1b1208;
    stroke-width: 1.2;
  }
  #hud .far {
    color: #ffc23a;
    white-space: nowrap;
  }
  #hud .ring {
    padding: 5px 12px 5px 5px;
    border-radius: 999px;
    font-size: 14px;
  }
  #hud .ring[hidden] {
    display: none;
  }
  #hud .ring svg {
    width: 30px;
    height: 30px;
    fill: none;
    stroke-width: 4;
  }
  #hud .ring .track {
    stroke: rgba(255, 255, 255, 0.2);
  }
  #hud .ring .fill {
    stroke: #ffc23a;
    stroke-linecap: round;
  }
  #hud .done {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  #hud .done[hidden] {
    display: none;
  }
  #hud .card {
    pointer-events: auto;
    text-align: center;
    padding: 22px 30px;
    background: rgba(14, 12, 20, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 18px;
    backdrop-filter: blur(10px);
    font-size: 15px;
    font-weight: 600;
  }
  #hud .card h2 {
    margin: 0 0 4px;
    font-size: 30px;
    color: #ffc23a;
  }
  #hud .card button {
    margin-top: 16px;
    min-width: 160px;
    min-height: 48px;
    border: 0;
    border-radius: 12px;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    color: #1b1208;
    background: linear-gradient(#ffb070, #e8863a 55%, #c96a26);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    cursor: pointer;
  }
  @media (max-width: 600px) {
    #hud .bar {
      font-size: 13px;
    }
    #hud .card h2 {
      font-size: 26px;
    }
  }
  /* the touch controls: a stick for the left thumb and a lever for the right, orange over the island, shown while flown by touch */
  #touch {
    position: fixed;
    inset: 0;
    display: none;
    pointer-events: none;
    font:
      600 11px/1 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    letter-spacing: 0.04em;
    color: #fff3e6;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  body.touching #touch {
    display: block;
  }
  body.touching #help {
    display: none;
  }
  #touch .base,
  #touch .knob {
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 50%;
  }
  #touch .base {
    background: rgba(20, 18, 28, 0.45);
    border: 3px solid rgba(232, 134, 58, 0.9);
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
    opacity: 0.6;
  }
  #touch .base.held {
    opacity: 1;
  }
  #touch .knob {
    background: radial-gradient(circle at 35% 30%, #ffb070, #e8863a 60%, #b85a1c);
    border: 2px solid #fff3e6;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  }
  #touch .chev {
    position: absolute;
    font-size: 14px;
    opacity: 0.9;
  }
  #touch .chev.up {
    top: 6px;
    left: 50%;
    translate: -50% 0;
  }
  #touch .chev.down {
    bottom: 6px;
    left: 50%;
    translate: -50% 0;
  }
  #touch .chev.left {
    left: 8px;
    top: 50%;
    translate: 0 -50%;
  }
  #touch .chev.right {
    right: 8px;
    top: 50%;
    translate: 0 -50%;
  }
  #touch .base .label {
    position: absolute;
    top: 100%;
    left: -40px;
    right: -40px;
    margin-top: 6px;
    text-align: center;
  }
  #touch .track {
    position: absolute;
    right: calc(28px + env(safe-area-inset-right));
    bottom: calc(40px + env(safe-area-inset-bottom));
    width: 58px;
    height: min(250px, calc(100% - 100px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
    border-radius: 12px;
    background: rgba(20, 18, 28, 0.45);
    border: 3px solid rgba(232, 134, 58, 0.9);
  }
  #touch .track .top,
  #touch .track .bottom {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
  }
  #touch .track .top {
    top: 6px;
  }
  #touch .track .bottom {
    bottom: 6px;
  }
  #touch .stop {
    position: absolute;
    left: -10px;
    right: -10px;
    top: 0;
    height: 3px;
    margin-top: -1.5px;
    background: #fff3e6;
    border-radius: 2px;
  }
  #touch .stop .label,
  #touch .track .sink {
    position: absolute;
    right: calc(100% + 6px);
    white-space: nowrap;
  }
  #touch .stop .label {
    top: -4px;
  }
  #touch .track .sink {
    top: calc(50% + 8px);
    right: calc(100% + 16px);
    opacity: 0.7;
  }
  #touch .handle {
    position: absolute;
    left: 3px;
    right: 3px;
    top: 0;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(#ffb070, #e8863a 55%, #b85a1c);
    border: 2px solid #fff3e6;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  }
  @media (max-width: 600px) {
    #help,
    #stats {
      display: none;
    }
  }
</style>
<div id="stage"><canvas id="view"></canvas></div>
<div class="panel" id="stats" hidden></div>
<div class="panel" id="help" hidden>
  <span>W S</span> fly · <span>A D</span> turn · <span>Space Shift</span> up, down
</div>
<div id="boot">
  <p id="bootMsg">starting WebGPU…</p>
</div>
<script type="module" src="/src/main.ts"></script>
