<!doctype html>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Chopdrop</title>
<!-- inline, so the browser does not go asking for a /favicon.ico there is none of -->
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8863a'/%3E%3C/svg%3E"
/>
<style>
  :root {
    color-scheme: dark;
    --ink: #f1eee6;
    --dim: #a39f94;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0b0a10;
    overflow: hidden;
  }
  body {
    font:
      14px/1.5 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    color: var(--ink);
  }
  #stage {
    position: fixed;
    inset: 0;
    /* fingers on the stage fly the helicopter, and do not scroll, zoom or swipe the page */
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .panel {
    position: fixed;
    padding: 10px 14px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #stats {
    top: 16px;
    right: 16px;
    text-align: right;
    color: var(--dim);
    font-size: 12px;
  }
  #help {
    bottom: 16px;
    left: 16px;
    color: var(--dim);
    font-size: 13px;
  }
  #help span {
    color: var(--ink);
    background: rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    padding: 0 6px;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #0b0a10;
    transition: opacity 0.4s;
  }
  #boot.gone {
    opacity: 0;
    pointer-events: none;
  }
  #boot p {
    color: var(--dim);
  }
  /* the words while a level is flown: what is wanted and where, the ring while loading, and the card at the end */
  #hud .top {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100vw - 28px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  #hud.ended .top {
    display: none;
  }
  #hud .bar,
  #hud .loader {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    color: var(--ink);
    font-weight: 600;
  }
  #hud .bar {
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.25;
  }
  #hud .arrow {
    width: 26px;
    height: 26px;
    flex: none;
    fill: #ffc23a;
    stroke: #1b1208;
    stroke-width: 1.2;
  }
  #hud .far {
    color: #ffc23a;
    white-space: nowrap;
  }
  #hud .clock {
    padding-left: 10px;
    border-left: 1px solid rgba(255, 255, 255, 0.2);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #hud .loader {
    padding: 5px 12px 5px 5px;
    border-radius: 999px;
    font-size: 14px;
  }
  #hud .loader[hidden] {
    display: none;
  }
  #hud .loader svg {
    width: 30px;
    height: 30px;
    fill: none;
    stroke-width: 4;
  }
  #hud .loader .track {
    stroke: rgba(255, 255, 255, 0.2);
  }
  #hud .loader .fill {
    stroke: #ffc23a;
    stroke-linecap: round;
  }
  #hud .done {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  #hud .done[hidden] {
    display: none;
  }
  #hud .card {
    pointer-events: auto;
    text-align: center;
    padding: 22px 30px;
    background: rgba(14, 12, 20, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 18px;
    backdrop-filter: blur(10px);
    font-size: 15px;
    font-weight: 600;
  }
  #hud .card h2 {
    margin: 0 0 4px;
    font-size: 30px;
    color: #ffc23a;
  }
  #hud .card .best {
    margin-top: 2px;
    color: #9fe07a;
    font-size: 14px;
    font-weight: 700;
  }
  #hud .card .best[hidden],
  #hud .card button[hidden] {
    display: none;
  }
  #hud .card .actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
  }
  #hud .card .actions:first-of-type {
    margin-top: 16px;
  }
  #hud .card .actions:has(> [hidden]:only-child) {
    display: none;
  }
  /* the orange button is the way on; the plain ones are the ways round */
  #hud .card .next,
  #levels .go {
    border: 0;
    border-radius: 12px;
    font: inherit;
    font-weight: 700;
    color: #1b1208;
    background: linear-gradient(#ffb070, #e8863a 55%, #c96a26);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    cursor: pointer;
  }
  #hud .card button {
    min-width: 128px;
    min-height: 48px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
  }
  #hud .card .next {
    min-width: 200px;
    font-size: 16px;
  }
  #hud .card .again,
  #hud .card .list {
    color: var(--ink);
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.18);
  }
  /* the card after the last level has no way on, and its first way round is its way on */
  #hud .card .actions:has(> .next[hidden]) + .actions .again {
    color: #1b1208;
    background: linear-gradient(#ffb070, #e8863a 55%, #c96a26);
    border: 0;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
  }
  /* the button a key would press, ringed in the gold of the words and not the browser's blue */
  #hud button:focus-visible,
  #levels button:focus-visible {
    outline: 2px solid #ffc23a;
    outline-offset: 2px;
  }
  /* back to the levels, from the corner while a level is flown */
  #hud .to-levels {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: calc(14px + env(safe-area-inset-left));
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    padding: 0;
    border-radius: 12px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    cursor: pointer;
  }
  #hud .to-levels svg {
    width: 20px;
    height: 20px;
    fill: #ffc23a;
  }
  #hud.ended .to-levels,
  #hud.away {
    display: none;
  }
  @media (max-width: 600px) {
    #hud .bar {
      font-size: 13px;
    }
    /* clear of the corner button, on a screen too narrow for the words to pass beside it */
    #hud .top {
      max-width: calc(100vw - 2 * (14px + 44px + 8px));
    }
    #hud .card h2 {
      font-size: 26px;
    }
  }
  /* the list of levels, over the island dimmed, the game held behind it */
  #levels {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));
    background: rgba(11, 10, 16, 0.55);
  }
  #levels[hidden] {
    display: none;
  }
  #levels .sheet {
    position: relative;
    width: min(560px, 100%);
    max-height: 100%;
    overflow: auto;
    padding: 22px 22px 18px;
    border-radius: 18px;
    background: rgba(14, 12, 20, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(12px);
  }
  #levels h1 {
    margin: 0 0 2px;
    font-size: 30px;
    line-height: 1.2;
  }
  #levels h1 b {
    color: #ffc23a;
  }
  #levels .sub {
    color: var(--dim);
    margin-bottom: 14px;
  }
  #levels .close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--ink);
    font: inherit;
    font-size: 18px;
    cursor: pointer;
  }
  #levels .close[hidden] {
    display: none;
  }
  #levels .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
    gap: 10px;
  }
  #levels .lv {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-height: 92px;
    padding: 12px 12px 10px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  #levels .lv .n {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 22px;
    font-weight: 800;
    line-height: 1.2;
    color: #ffc23a;
  }
  #levels .lv .lock {
    display: none;
    width: 15px;
    height: 15px;
    fill: none;
    stroke: #ffc23a;
    stroke-width: 2;
  }
  #levels .lv.locked .lock {
    display: block;
  }
  #levels .lv .name {
    margin-top: 2px;
    font-weight: 700;
    line-height: 1.3;
  }
  #levels .lv .kind {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
    color: var(--dim);
    font-size: 12px;
  }
  #levels .lv .kind svg {
    width: 13px;
    height: 13px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linejoin: round;
  }
  #levels .lv .best {
    position: absolute;
    top: 12px;
    right: 12px;
    color: #9fe07a;
    font-size: 12px;
    font-weight: 700;
  }
  #levels .lv .best[hidden] {
    display: none;
  }
  #levels .lv.picked {
    background: rgba(232, 134, 58, 0.12);
    border-color: #e8863a;
    box-shadow: 0 0 0 2px rgba(232, 134, 58, 0.5) inset;
  }
  #levels .lv.locked {
    opacity: 0.42;
    cursor: default;
  }
  #levels .go {
    width: 100%;
    min-height: 50px;
    margin-top: 16px;
    font-size: 17px;
  }
  /* the touch controls: a stick for the left thumb and a lever for the right, orange over the island, shown while flown by touch */
  #touch {
    position: fixed;
    inset: 0;
    display: none;
    pointer-events: none;
    font:
      600 11px/1 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    letter-spacing: 0.04em;
    color: #fff3e6;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  body.touching #touch {
    display: block;
  }
  body.touching #help {
    display: none;
  }
  #touch .base,
  #touch .knob {
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 50%;
  }
  #touch .base {
    background: rgba(20, 18, 28, 0.45);
    border: 3px solid rgba(232, 134, 58, 0.9);
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
    opacity: 0.6;
  }
  #touch .base.held {
    opacity: 1;
  }
  #touch .knob {
    background: radial-gradient(circle at 35% 30%, #ffb070, #e8863a 60%, #b85a1c);
    border: 2px solid #fff3e6;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  }
  #touch .chev {
    position: absolute;
    font-size: 14px;
    opacity: 0.9;
  }
  #touch .chev.up {
    top: 6px;
    left: 50%;
    translate: -50% 0;
  }
  #touch .chev.down {
    bottom: 6px;
    left: 50%;
    translate: -50% 0;
  }
  #touch .chev.left {
    left: 8px;
    top: 50%;
    translate: 0 -50%;
  }
  #touch .chev.right {
    right: 8px;
    top: 50%;
    translate: 0 -50%;
  }
  #touch .base .label {
    position: absolute;
    top: 100%;
    left: -40px;
    right: -40px;
    margin-top: 6px;
    text-align: center;
  }
  #touch .track {
    position: absolute;
    right: calc(28px + env(safe-area-inset-right));
    bottom: calc(40px + env(safe-area-inset-bottom));
    width: 58px;
    height: min(250px, calc(100% - 100px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
    border-radius: 12px;
    background: rgba(20, 18, 28, 0.45);
    border: 3px solid rgba(232, 134, 58, 0.9);
  }
  #touch .track .top,
  #touch .track .bottom {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
  }
  #touch .track .top {
    top: 6px;
  }
  #touch .track .bottom {
    bottom: 6px;
  }
  #touch .stop {
    position: absolute;
    left: -10px;
    right: -10px;
    top: 0;
    height: 3px;
    margin-top: -1.5px;
    background: #fff3e6;
    border-radius: 2px;
  }
  #touch .stop .label,
  #touch .track .sink {
    position: absolute;
    right: calc(100% + 6px);
    white-space: nowrap;
  }
  #touch .stop .label {
    top: -4px;
  }
  #touch .track .sink {
    top: calc(50% + 8px);
    right: calc(100% + 16px);
    opacity: 0.7;
  }
  #touch .handle {
    position: absolute;
    left: 3px;
    right: 3px;
    top: 0;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(#ffb070, #e8863a 55%, #b85a1c);
    border: 2px solid #fff3e6;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  }
  @media (max-width: 600px) {
    #help,
    #stats {
      display: none;
    }
  }
  /* while the list is up, nothing of the flight is on the screen; the touch controls hide themselves */
  body.listing #help {
    display: none;
  }
</style>
<div id="stage"><canvas id="view"></canvas></div>
<div class="panel" id="stats" hidden></div>
<div class="panel" id="help" hidden>
  <span>W S</span> fly · <span>A D</span> turn · <span>Space Shift</span> up, down
</div>
<div id="boot">
  <p id="bootMsg">starting WebGPU…</p>
</div>
<script type="module" src="/src/main.ts"></script>
