<!doctype html>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Chopdrop</title>
<!-- inline, so the browser does not go asking for a /favicon.ico there is none of -->
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8863a'/%3E%3C/svg%3E"
/>
<style>
  :root {
    color-scheme: dark;
    --ink: #f1eee6;
    --dim: #a39f94;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0b0a10;
    overflow: hidden;
  }
  body {
    font:
      14px/1.5 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    color: var(--ink);
  }
  #stage {
    position: fixed;
    inset: 0;
    /* fingers on the stage fly the helicopter, and do not scroll, zoom or swipe the page */
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .panel {
    position: fixed;
    padding: 10px 14px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #stats {
    top: 16px;
    right: 16px;
    text-align: right;
    color: var(--dim);
    font-size: 12px;
  }
  #help {
    bottom: 16px;
    left: 16px;
    color: var(--dim);
    font-size: 13px;
  }
  #help span {
    color: var(--ink);
    background: rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    padding: 0 6px;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #0b0a10;
    transition: opacity 0.4s;
  }
  #boot.gone {
    opacity: 0;
    pointer-events: none;
  }
  #boot p {
    color: var(--dim);
  }
  /* the words: the hint flying free, the way to a start or what a level going wants, the ring while loading, and the toast at the end */
  #hud .top {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100vw - 28px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  #hud .bar,
  #hud .loader {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    color: var(--ink);
    font-weight: 600;
  }
  #hud .bar {
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.25;
  }
  #hud .arrow {
    width: 26px;
    height: 26px;
    flex: none;
    fill: #ffc23a;
    stroke: #1b1208;
    stroke-width: 1.2;
  }
  #hud .far {
    color: #ffc23a;
    white-space: nowrap;
  }
  #hud .clock {
    padding-left: 10px;
    border-left: 1px solid rgba(255, 255, 255, 0.2);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #hud .loader {
    padding: 5px 12px 5px 5px;
    border-radius: 999px;
    font-size: 14px;
  }
  #hud .loader[hidden] {
    display: none;
  }
  #hud .loader svg {
    width: 30px;
    height: 30px;
    fill: none;
    stroke-width: 4;
  }
  #hud .loader .track {
    stroke: rgba(255, 255, 255, 0.2);
  }
  #hud .loader .fill {
    stroke: #ffc23a;
    stroke-linecap: round;
  }
  /* what the bar holds: the hint alone flying free, the way to a start with a guide, and all of it with a level going */
  #hud .bar .hint {
    color: var(--dim);
    font-weight: 500;
    white-space: nowrap;
  }
  #hud .bar:not([data-mode='free']) .hint,
  #hud .bar[data-mode='free'] > :not(.hint),
  #hud .bar[data-mode='guided'] .clock {
    display: none;
  }
  /* under the toast, with nothing going, the bar is gone: the hint would only stack over the words that tell the end */
  #hud .bar[data-mode='quiet'] {
    display: none;
  }
  /* the toast under the bar: a small card that tells a level done, and goes of itself; the game is not held */
  #hud .toast {
    text-align: center;
    padding: 10px 22px;
    border-radius: 14px;
    background: rgba(14, 12, 20, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(8px);
    color: var(--ink);
    font-weight: 700;
  }
  #hud .toast[hidden] {
    display: none;
  }
  #hud .toast h2 {
    margin: 0;
    font-size: 22px;
    line-height: 1.25;
    color: #ffc23a;
  }
  #hud .toast .t {
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  #hud .toast .b {
    color: #9fe07a;
  }
  /* the button a key would press, ringed in the gold of the words and not the browser's blue */
  #hud button:focus-visible,
  #panel button:focus-visible {
    outline: 2px solid #ffc23a;
    outline-offset: 2px;
  }
  /* back to the levels, from the corner while a level is flown */
  #hud .to-levels {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: calc(14px + env(safe-area-inset-left));
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    padding: 0;
    border-radius: 12px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    cursor: pointer;
  }
  #hud .to-levels svg {
    width: 20px;
    height: 20px;
    fill: #ffc23a;
  }
  #hud.away {
    display: none;
  }
  @media (max-width: 600px) {
    #hud .bar {
      font-size: 13px;
    }
    /* clear of the corner button, on a screen too narrow for the words to pass beside it */
    #hud .top {
      max-width: calc(100vw - 2 * (14px + 44px + 8px));
    }
    #hud .toast h2 {
      font-size: 20px;
    }
  }
  /* the panel, over the island dimmed, the game held behind it: a row a level, one column at any width */
  #panel {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));
    background: rgba(11, 10, 16, 0.55);
  }
  #panel[hidden] {
    display: none;
  }
  #panel .sheet {
    position: relative;
    width: min(600px, 100%);
    max-height: 100%;
    overflow: auto;
    padding: 22px 22px 18px;
    border-radius: 18px;
    background: rgba(14, 12, 20, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(12px);
  }
  #panel h1 {
    margin: 0 0 2px;
    font-size: 30px;
    line-height: 1.2;
  }
  #panel h1 b {
    color: #ffc23a;
  }
  #panel .sub {
    color: var(--dim);
    margin-bottom: 14px;
    /* clear of the cross, which sits in the corner of the sheet */
    padding-right: 48px;
  }
  #panel .close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--ink);
    font: inherit;
    font-size: 18px;
    cursor: pointer;
  }
  #panel .row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 4px 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  #panel .row.going {
    border-color: #e8863a;
    background: rgba(232, 134, 58, 0.12);
  }
  #panel .row .name {
    font-weight: 700;
  }
  #panel .row .best {
    margin-left: 8px;
    color: #9fe07a;
    font-size: 12px;
  }
  #panel .row .now {
    margin-left: 6px;
    color: #ffc23a;
    font-size: 12px;
  }
  #panel .row [hidden] {
    display: none;
  }
  #panel .row .where {
    grid-column: 1;
    color: var(--dim);
    font-size: 13px;
  }
  #panel .row button {
    grid-row: 1 / span 2;
    grid-column: 2;
    min-height: 44px;
    padding: 0 14px;
    border-radius: 10px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.18);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  /* the one that gives a level up is the orange one */
  #panel .row.going button {
    border: 0;
    color: #1b1208;
    background: linear-gradient(#ffb070, #e8863a 55%, #c96a26);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
  }
  /* the touch controls: a stick for the left thumb and a lever for the right, orange over the island, shown while flown by touch */
  #touch {
    position: fixed;
    inset: 0;
    display: none;
    pointer-events: none;
    font:
      600 11px/1 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    letter-spacing: 0.04em;
    color: #fff3e6;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  body.touching #touch {
    display: block;
  }
  body.touching #help {
    display: none;
  }
  #touch .base,
  #touch .knob {
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 50%;
  }
  #touch .base {
    background: rgba(20, 18, 28, 0.45);
    border: 3px solid rgba(232, 134, 58, 0.9);
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
    opacity: 0.6;
  }
  #touch .base.held {
    opacity: 1;
  }
  #touch .knob {
    background: radial-gradient(circle at 35% 30%, #ffb070, #e8863a 60%, #b85a1c);
    border: 2px solid #fff3e6;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  }
  #touch .chev {
    position: absolute;
    font-size: 14px;
    opacity: 0.9;
  }
  #touch .chev.up {
    top: 6px;
    left: 50%;
    translate: -50% 0;
  }
  #touch .chev.down {
    bottom: 6px;
    left: 50%;
    translate: -50% 0;
  }
  #touch .chev.left {
    left: 8px;
    top: 50%;
    translate: 0 -50%;
  }
  #touch .chev.right {
    right: 8px;
    top: 50%;
    translate: 0 -50%;
  }
  #touch .base .label {
    position: absolute;
    top: 100%;
    left: -40px;
    right: -40px;
    margin-top: 6px;
    text-align: center;
  }
  #touch .track {
    position: absolute;
    right: calc(28px + env(safe-area-inset-right));
    bottom: calc(40px + env(safe-area-inset-bottom));
    width: 58px;
    height: min(250px, calc(100% - 100px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
    border-radius: 12px;
    background: rgba(20, 18, 28, 0.45);
    border: 3px solid rgba(232, 134, 58, 0.9);
  }
  #touch .track .top,
  #touch .track .bottom {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
  }
  #touch .track .top {
    top: 6px;
  }
  #touch .track .bottom {
    bottom: 6px;
  }
  #touch .stop {
    position: absolute;
    left: -10px;
    right: -10px;
    top: 0;
    height: 3px;
    margin-top: -1.5px;
    background: #fff3e6;
    border-radius: 2px;
  }
  #touch .stop .label,
  #touch .track .sink {
    position: absolute;
    right: calc(100% + 6px);
    white-space: nowrap;
  }
  #touch .stop .label {
    top: -4px;
  }
  #touch .track .sink {
    top: calc(50% + 8px);
    right: calc(100% + 16px);
    opacity: 0.7;
  }
  #touch .handle {
    position: absolute;
    left: 3px;
    right: 3px;
    top: 0;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(#ffb070, #e8863a 55%, #b85a1c);
    border: 2px solid #fff3e6;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  }
  @media (max-width: 600px) {
    #help,
    #stats {
      display: none;
    }
  }
  /* while the panel is up, nothing of the flight is on the screen; the touch controls hide themselves */
  body.listing #help {
    display: none;
  }
</style>
<div id="stage"><canvas id="view"></canvas></div>
<div class="panel" id="stats" hidden></div>
<div class="panel" id="help" hidden>
  <span>W S</span> fly · <span>A D</span> turn · <span>Space Shift</span> up, down
</div>
<div id="boot">
  <p id="bootMsg">starting WebGPU…</p>
</div>
<script type="module" src="/src/main.ts"></script>
